[project]
name = "tinystudio"
version = "0.1.0"
description = "Local, account-free pipeline for training, evaluating, and serving tiny and domain-specific language models: datasets, snapshots, recommendations, experiments, rubric evaluations, OpenAI-compatible serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "torch>=2.6",
  "transformers>=4.50",
  "datasets>=3.0",
  "trl>=0.19",
  "peft>=0.15",
  "accelerate>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "typer>=0.15",
  "httpx>=0.28",
  "pydantic>=2.9",
  "python-multipart>=0.0.20",
  "mcp>=2.3",
  "pypdf>=5.0",
  "rich>=13.9",
]

[project.optional-dependencies]
youtube = ["youtube-transcript-api>=1.0"]
assistant = ["anthropic>=2.1", "openai>=3.36"]
mlx = ["mlx-lm>=0.24"]
dev = ["pytest>=8.3"]

[project.scripts]
tinystudio = "tinystudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinystudio"]
