[project]
name = "tinystudio"
version = "0.1.0"
description = "Local, account-free pipeline for training, evaluating, and serving tiny and domain-specific language models: datasets, snapshots, recommendations, experiments, rubric evaluations, OpenAI-compatible serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "torch>=2.6",
  "transformers>=4.50",
  "datasets>=3.0",
  "trl>=0.19",
  "peft>=0.15",
  "accelerate>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "typer>=0.15",
  "httpx>=0.28",
  "pydantic>=2.9",
  "python-multipart>=0.0.20",
  "mcp>=2.3",
  "pypdf>=6.21.1",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.13",
  "redis>=5.2",
  "rq>=2.12",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "pyarrow>=18",
  "PyJWT[crypto]>=2.10",
  "filelock>=3.18",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
]

[project.optional-dependencies]
youtube = ["youtube-transcript-api>=1.0"]
assistant = ["anthropic>=2.1", "openai>=3.36"]
mlx = ["mlx-lm>=0.24"]
dev = ["pytest>=8.3"]

[project.scripts]
tinystudio = "tinystudio.cli:main"

[build-system]
requires = ["hatchling", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinystudio"]

[tool.hatch.build]
artifacts = ["tinystudio/ui/dist/**"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_frontend_hook.py"
